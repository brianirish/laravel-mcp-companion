[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laravel-mcp-companion"
version = "0.15.0"
description = "A Laravel developer's MCP companion. Get the absolute best advice, recommendations, and up-to-date documentation for the entire Laravel ecosystem."
authors = [{name = "Brian Irish", email = "irishb@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "fastmcp[code-mode,tasks]>=3.4.5,<4",
    "markdownify>=1.2.2",
    "beautifulsoup4>=4.14.3",
    "uvicorn>=0.38.0",
    "starlette>=1.3.1",
    "toon-format>=1.2.0,<2",
]
keywords = ["laravel", "mcp", "documentation", "ai", "modelcontextprotocol", "php", "companion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
laravel-mcp-companion = "laravel_mcp_companion.server:main"
laravel-mcp-companion-docs = "laravel_mcp_companion.docs_updater:main"

[project.urls]
Repository = "https://github.com/brianirish/laravel-mcp-companion"
Issues = "https://github.com/brianirish/laravel-mcp-companion/issues"

[tool.hatch.build.targets.wheel]
packages = ["laravel_mcp_companion"]

# hatch_build.py adds the documentation corpus and server.json to the wheel,
# so an installed copy works offline with no first-run download.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
    "/laravel_mcp_companion",
    "/docs",
    "/hatch_build.py",
    "/server.json",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
exclude = ["/docs/superpowers"]

[dependency-groups]
dev = [
    "ruff>=0.12.3",
    "mypy>=1.16.1",
    "pytest",
    "pytest-cov",
    "pytest-asyncio>=1.0.0",
    "black",
    "inline-snapshot",
    "pytest-timeout>=2.4.0",
    "hatchling>=1.33.0",
]

[tool.ruff.lint]
# ruff 0.15 broadened its default rule set; keep the pre-0.15 defaults explicit.
# Broader adoption (UP/SIM/BLE/etc.) should be its own PR.
select = ["E4", "E7", "E9", "F"]

# pytest configuration lives in pytest.ini, which takes precedence over this
# file. A [tool.pytest.ini_options] block here would be silently ignored, so
# it is deliberately absent -- the previous one had drifted to a stale, shorter
# module list that nothing was reading.

[tool.coverage.run]
# Branch coverage is on here rather than passed on the command line, so a bare
# `pytest` and CI's `pytest --cov --cov-branch` report the identical number.
branch = true
# Measure the product modules only. Without this, CI's bare `--cov` also
# measured the test suite, whose near-total coverage inflated the number well
# past the threshold while product coverage sat much lower.
source = ["laravel_mcp_companion"]
omit = [
    "tests/*",
    "*/site-packages/*",
]
