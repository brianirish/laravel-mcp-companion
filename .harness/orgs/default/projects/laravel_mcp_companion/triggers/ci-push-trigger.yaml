# MIRROR ONLY -- Harness does not read this file. See README.md.
#
# Captured from Harness on 2026-11-11, after the change below was applied.
#
# The trigger used to fire on every push, tags included. Each nightly docs sync
# pushes a branch, merges it and then pushes a docs-YYYY-MM-DD tag, so CI ran
# three times a night, the third time on the commit it had just tested on main.
# The account gets 2,000 build credits a month and running out stops every
# pipeline (it did, 2026-10-25 to 10-31), so tag pushes are skipped.
#
# One Regex condition, not a second condition alongside another: conditions
# are ANDed. Checked against real refs: refs/heads/main,
# refs/heads/update-laravel-docs and refs/heads/dependabot/uv/... match;
# refs/tags/docs-2026-11-12 and refs/tags/v0.13.0 do not.

trigger:
  name: ci-push-trigger
  identifier: ci_push_trigger
  enabled: true
  encryptedWebhookSecretIdentifier: ""
  description: Trigger CI on every push to a branch (tag pushes are skipped)
  tags: {}
  orgIdentifier: default
  stagesToExecute: []
  projectIdentifier: laravel_mcp_companion
  pipelineIdentifier: ci
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: Push
        spec:
          connectorRef: Laravel_MCP_Companion
          autoAbortPreviousExecutions: false
          payloadConditions:
            - key: <+trigger.payload.ref>
              operator: Regex
              value: ^refs/heads/.*
          headerConditions: []
  inputSetRefs:
    - ci_push_input_set
  pipelineBranchName: <+trigger.branch>
