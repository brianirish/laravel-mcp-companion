pipeline:
  identifier: release
  name: Release
  orgIdentifier: default
  projectIdentifier: laravel_mcp_companion
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: Laravel_MCP_Companion
        repoName: brianirish/laravel-mcp-companion
  # Email the "Pipeline Alerts" user group when a run fails. The group lives in
  # Harness (project scope) and holds the addresses, so none are kept in this
  # public file. This only covers runs that start: a trigger that fails to
  # create an execution -- a rejected YAML, an exhausted build allowance --
  # produces no run and so no notification. Check the trigger's event history
  # for those.
  notificationRules:
    - name: Notify on failure
      identifier: notify_on_failure
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Email
        spec:
          userGroups:
            - pipeline_alerts
          recipients: []
      enabled: true
  stages:
    - stage:
        identifier: build_and_push
        name: Build and Push Docker Image
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: prepare_tree
                  name: Prepare the tree to build
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail

                      # A docs-YYYY-MM-DD tag marks a nightly sync on main. Built
                      # as tagged it would ship every change merged since the
                      # last release to everyone on `latest`, so for those tags
                      # this swaps in the newest release's code and keeps the
                      # tag's docs/. Version tags are built as they are. The
                      # logic and its tests live with the script.
                      bash scripts/release_tree.sh "<+trigger.tag>"

                      # `latest` follows the newest stable release and its
                      # nightly docs builds. A release candidate, or a patch to
                      # an older line, gets its own tag twice instead.
                      MOVING_TAG="$(bash scripts/release_tree.sh --moving-tag "<+trigger.tag>" 2>/dev/null || true)"
                      export MOVING_TAG="${MOVING_TAG:-<+trigger.tag>}"
                      echo "Pushing as: <+trigger.tag> and ${MOVING_TAG}"
                    outputVariables:
                      - name: MOVING_TAG
              - step:
                  identifier: build_push_multiarch
                  name: Build and Push multi-arch
                  type: BuildAndPushDockerRegistry
                  spec:
                    connectorRef: ghcr
                    repo: ghcr.io/brianirish/laravel-mcp-companion
                    tags:
                      - <+execution.steps.prepare_tree.output.outputVariables.MOVING_TAG>
                      - <+trigger.tag>
                    dockerfile: Dockerfile
                    context: .
                    buildx: true
                    platforms:
                      - linux/amd64
                      - linux/arm64
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
