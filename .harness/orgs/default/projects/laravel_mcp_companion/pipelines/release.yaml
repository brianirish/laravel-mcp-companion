pipeline:
  identifier: release
  name: Release
  orgIdentifier: default
  projectIdentifier: laravel_mcp_companion
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: Laravel_MCP_Companion
        repoName: brianirish/laravel-mcp-companion
  # Email the "Pipeline Alerts" user group when a run fails. The group lives in
  # Harness (project scope) and holds the addresses, so none are kept in this
  # public file. This only covers runs that start: a trigger that fails to
  # create an execution -- a rejected YAML, an exhausted build allowance --
  # produces no run and so no notification. Check the trigger's event history
  # for those.
  notificationRules:
    - name: Notify on failure
      identifier: notify_on_failure
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Email
        spec:
          userGroups:
            - pipeline_alerts
          recipients: []
      enabled: true
  stages:
    - stage:
        identifier: build_and_push
        name: Build and Push Docker Image
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: build_push_multiarch
                  name: Build and Push multi-arch
                  type: BuildAndPushDockerRegistry
                  spec:
                    connectorRef: ghcr
                    repo: ghcr.io/brianirish/laravel-mcp-companion
                    tags:
                      - latest
                      - <+trigger.tag>
                    dockerfile: Dockerfile
                    context: .
                    buildx: true
                    platforms:
                      - linux/amd64
                      - linux/arm64
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
