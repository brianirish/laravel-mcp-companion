pipeline:
  identifier: docs_update
  name: Docs Update
  orgIdentifier: default
  projectIdentifier: laravel_mcp_companion
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: Laravel_MCP_Companion
        repoName: brianirish/laravel-mcp-companion
  # Email the "Pipeline Alerts" user group when a run fails. The group lives in
  # Harness (project scope) and holds the addresses, so none are kept in this
  # public file. This only covers runs that start: a trigger that fails to
  # create an execution -- a rejected YAML, an exhausted build allowance --
  # produces no run and so no notification. Check the trigger's event history
  # for those.
  notificationRules:
    - name: Notify on failure
      identifier: notify_on_failure
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Email
        spec:
          userGroups:
            - pipeline_alerts
          recipients: []
      enabled: true
  stages:
    - stage:
        identifier: check_and_update
        name: Check and Update Docs
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: fetch_latest_main
                  name: Fetch latest main
                  type: Run
                  spec:
                    shell: Sh
                    command: |
                      git fetch origin main
                      git reset --hard origin/main
              - step:
                  identifier: install_gh_cli
                  name: Install latest gh CLI
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      # Harness Cloud runner may have old gh CLI, install latest
                      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
                      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
                      sudo apt-get update
                      sudo apt-get install -y gh
                      gh --version
              - step:
                  identifier: install_dependencies
                  name: Install dependencies
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail

                      # This job runs docs_updater.py daily in production, so it
                      # needs the interpreter the project declares (>=3.12) rather
                      # than whatever the runner image ships, which is 3.10. CI was
                      # fixed for this; the pipeline that actually runs was not.
                      export UV_INSTALL_DIR="$HOME/.local/bin"
                      curl -LsSf --retry 3 --retry-delay 2 https://astral.sh/uv/install.sh | sh
                      export PATH="$UV_INSTALL_DIR:$PATH"

                      # Install what uv.lock pins, the same versions CI tests
                      # and the image ships, without the development tools.
                      # Later steps `source .venv/bin/activate`.
                      uv python install 3.12
                      uv sync --frozen --no-dev --python 3.12

                      .venv/bin/python --version
              - step:
                  identifier: check_updates
                  name: Check for documentation updates
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      set +e
                      source .venv/bin/activate

                      echo "Updating Laravel framework docs for all versions..."
                      python docs_updater.py --all-versions --log-level INFO
                      CORE_STATUS=$?

                      # Services, community packages and learning resources.
                      # This exit code is not a health signal -- it is non-zero
                      # whenever the framework docs were already up to date --
                      # so health is read from the report below instead.
                      #
                      # --force: every source is refetched on every run. The
                      # fetchers cache for 24 hours, and this job runs every 24
                      # hours, so without it a source whose last fetch landed a
                      # few seconds inside the window was skipped, and each one
                      # refreshed on alternate days at best.
                      echo "Updating services, packages and learning resources..."
                      python docs_updater.py --update --force --log-level INFO

                      # Per-source health, from the metadata each fetch leaves
                      # behind. Exits non-zero if any source fetched too little
                      # or has not synced recently. This run used to discard
                      # every exit code: Forge fetching 18 of 39 pages, and
                      # sources whose sites had gone away, all passed as green.
                      python docs_updater.py --sync-report > sync_report.md 2>/dev/null
                      REPORT_STATUS=$?

                      DEGRADED="false"
                      if [ "$REPORT_STATUS" -ne 0 ]; then
                        DEGRADED="true"
                      fi
                      if [ "$CORE_STATUS" -ne 0 ]; then
                        DEGRADED="true"
                        printf '\n### Framework docs\n\n- The framework docs update exited with status %s.\n' "$CORE_STATUS" >> sync_report.md
                      fi
                      cat sync_report.md

                      # Stage everything under docs/ -- new and deleted pages
                      # included -- then judge the change by its content. Each
                      # run rewrites cache timestamps, so a diff made only of
                      # metadata is not an update. About a fifth of the pull
                      # requests this job opened changed nothing else, and each
                      # one still produced a tag and a Docker image.
                      git add -A docs/
                      METADATA='(^|/)\.cache_metadata\.json$|/\.metadata/[^/]+\.json$|(^|/)\.versions_cache\.json$'
                      CONTENT_CHANGES=$(git diff --cached --no-renames --name-status -- docs/ | grep -vE "$METADATA" || true)

                      if [ -z "$CONTENT_CHANGES" ]; then
                        echo "No documentation content changed"
                        UPDATES_AVAILABLE="false"
                      else
                        UPDATES_AVAILABLE="true"
                        echo "Documentation content changed:"
                        echo "$CONTENT_CHANGES"

                        # The pull request body: what this run changed, then
                        # the health report. The body used to be a fixed text.
                        {
                          echo "Automated documentation sync."
                          echo
                          echo "## What changed"
                          echo
                          echo "$CONTENT_CHANGES" | awk -F'\t' '
                            {
                              split($2, part, "/")
                              if (part[2] == "external" || part[2] == "packages" || part[2] == "learning_resources")
                                area = part[2] "/" part[3]
                              else
                                area = "Laravel " part[2]
                              if ($1 == "A") added[area]++
                              else if ($1 == "D") removed[area]++
                              else changed[area]++
                              seen[area] = 1
                            }
                            END {
                              for (area in seen)
                                printf "- %s: %d changed, %d added, %d removed\n", area, changed[area], added[area], removed[area]
                            }' | sort
                          echo
                          cat sync_report.md
                        } > pr_body.md
                      fi

                      # With nothing to publish, the tagging stage is skipped,
                      # so a degraded run has to fail here to be seen at all.
                      FAIL_WITHOUT_PUBLISHING="false"
                      if [ "$DEGRADED" = "true" ] && [ "$UPDATES_AVAILABLE" = "false" ]; then
                        FAIL_WITHOUT_PUBLISHING="true"
                      fi
                    outputVariables:
                      - name: UPDATES_AVAILABLE
                      - name: DEGRADED
                      - name: FAIL_WITHOUT_PUBLISHING
              - step:
                  identifier: report_degraded_sync
                  name: Report degraded sync
                  type: Run
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_updates.output.outputVariables.DEGRADED> == "true"
                  spec:
                    shell: Sh
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("GITHUB_TOKEN")>
                    command: |
                      # Keep one open issue current rather than opening one a
                      # day. Never fails the run: the healthy sources still
                      # publish, and the run is failed explicitly further on.
                      EXISTING=$(gh issue list --state open --search "Docs sync degraded in:title" --json number -q '.[0].number' 2>/dev/null)
                      if [ -n "$EXISTING" ]; then
                        gh issue edit "$EXISTING" --body-file sync_report.md || echo "Could not update issue #$EXISTING"
                      else
                        gh issue create --title "Docs sync degraded" --body-file sync_report.md || echo "Could not open an issue"
                      fi
              - step:
                  identifier: close_existing_prs
                  name: Close existing pull requests
                  type: Run
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_updates.output.outputVariables.UPDATES_AVAILABLE> == "true"
                  spec:
                    shell: Sh
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("GITHUB_TOKEN")>
                    command: |

                      # Close any existing docs update PRs
                      PR_NUMBERS=$(gh pr list --state open --head update-laravel-docs --json number -q '.[].number')
                      for PR in $PR_NUMBERS; do
                        echo "Closing existing PR #$PR"
                        gh pr close "$PR"
                      done

                      # Delete the remote branch if it exists
                      git push origin --delete update-laravel-docs 2>/dev/null || echo "No existing remote branch to delete"
              - step:
                  identifier: commit_and_push
                  name: Commit and push changes
                  type: Run
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_updates.output.outputVariables.UPDATES_AVAILABLE> == "true"
                  spec:
                    shell: Sh
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("GITHUB_TOKEN")>
                    command: |
                      git config --local user.email "action@github.com"
                      git config --local user.name "GitHub Action"
                      git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/brianirish/laravel-mcp-companion.git"
                      git checkout -b update-laravel-docs
                      git add -A docs/
                      git commit -m "Update Laravel and external services documentation" || exit 0
                      git push origin update-laravel-docs --force
              - step:
                  identifier: create_pr
                  name: Create pull request
                  type: Run
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_updates.output.outputVariables.UPDATES_AVAILABLE> == "true"
                  spec:
                    shell: Sh
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("GITHUB_TOKEN")>
                    command: |
                      PR_URL=$(gh pr create \
                        --title "Update Laravel and external services documentation" \
                        --body-file pr_body.md \
                        --head update-laravel-docs \
                        --base main)

                      PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
                      echo "Created PR #$PR_NUMBER: $PR_URL"
                    outputVariables:
                      - name: PR_NUMBER
              - step:
                  identifier: enable_auto_merge
                  name: Enable auto-merge
                  type: Run
                  timeout: 5m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_updates.output.outputVariables.UPDATES_AVAILABLE> == "true"
                  spec:
                    shell: Sh
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("GITHUB_TOKEN")>
                    command: |
                      PR_NUMBER=<+execution.steps.create_pr.output.outputVariables.PR_NUMBER>

                      gh pr merge "$PR_NUMBER" --auto --squash

                      # Do not wait on the pull request's checks here. This step
                      # used to run `gh pr checks --watch`, which only returns
                      # once every check has finished -- including ones nothing
                      # requires. From 2026-09-19 CodeRabbit left a "Review in
                      # progress" status pending on a pull request that had
                      # already merged, so the watch ran until the stage timed
                      # out at 30 minutes, the tagging stage was skipped, and
                      # no Docker image was published for six weeks. The hung
                      # runs then used up the account's build allowance, and
                      # nothing ran at all from 2026-10-25 to 2026-10-31.
                      #
                      # GitHub merges when the required checks pass; the next
                      # stage polls for that merge with a bounded loop.
              - step:
                  identifier: fail_without_publishing
                  name: Fail when degraded with nothing to publish
                  type: Run
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_updates.output.outputVariables.FAIL_WITHOUT_PUBLISHING> == "true"
                  spec:
                    shell: Sh
                    command: |
                      echo "The docs sync is degraded and there was nothing to publish."
                      cat sync_report.md
                      exit 1
    - stage:
        identifier: auto_tag_after_merge
        name: Auto Tag After Merge
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.check_and_update.spec.execution.steps.check_updates.output.outputVariables.UPDATES_AVAILABLE> == "true"
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: install_gh_cli
                  name: Install latest gh CLI
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      # Harness Cloud runner may have old gh CLI, install latest
                      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
                      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
                      sudo apt-get update
                      sudo apt-get install -y gh
                      gh --version
              - step:
                  identifier: wait_for_merge
                  name: Wait for PR to be merged
                  type: Run
                  spec:
                    shell: Sh
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("GITHUB_TOKEN")>
                    command: |
                      PR_NUMBER=<+pipeline.stages.check_and_update.spec.execution.steps.create_pr.output.outputVariables.PR_NUMBER>

                      if [ -z "$PR_NUMBER" ]; then
                        echo "No PR number available"
                        exit 1
                      fi

                      # Wait up to 10 minutes for the PR to be merged
                      MERGED=false
                      for i in $(seq 1 80); do
                        PR_STATE=$(gh pr view "$PR_NUMBER" --json state,mergedAt -q '.state')
                        if [ "$PR_STATE" = "MERGED" ]; then
                          echo "PR $PR_NUMBER has been merged!"
                          MERGE_COMMIT=$(gh pr view "$PR_NUMBER" --json mergeCommit -q '.mergeCommit.oid')
                          echo "Merge commit: $MERGE_COMMIT"
                          MERGED=true
                          break
                        fi
                        echo "PR state: $PR_STATE. Waiting... (attempt $i/80)"
                        sleep 15
                      done

                      if [ "$MERGED" = "false" ]; then
                        echo "PR was not merged within timeout"
                        exit 1
                      fi
                    outputVariables:
                      - name: MERGE_COMMIT
              - step:
                  identifier: checkout_merge_commit
                  name: Checkout merge commit
                  type: Run
                  spec:
                    shell: Sh
                    command: |
                      git fetch origin
                      git checkout <+execution.steps.wait_for_merge.output.outputVariables.MERGE_COMMIT>
              - step:
                  identifier: create_docs_tag
                  name: Create docs tag
                  type: Run
                  spec:
                    shell: Bash
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("PAT_FOR_WORKFLOWS")>
                    command: |
                      set -euo pipefail

                      # Documentation syncs are tagged by date, not by semantic
                      # version. They previously incremented the patch number on
                      # every run, so ~145 consecutive releases were content
                      # refreshes and the version number tracked days elapsed
                      # rather than anything about the software. Each one also
                      # published a GitHub Release marked --latest, which pushed
                      # real releases off the repository front page.
                      #
                      # NOTE: the release pipeline builds Docker images from tag
                      # pushes, so its trigger must match BOTH "v*" and "docs-*".
                      # If docs images stop publishing, check that trigger first.
                      git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/brianirish/laravel-mcp-companion.git"

                      TAG="docs-$(date -u +%Y-%m-%d)"

                      # A second sync on the same day would collide; fall back to
                      # a minute-precision tag rather than failing the pipeline.
                      git fetch --tags --quiet origin
                      if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
                        TAG="docs-$(date -u +%Y-%m-%d-%H%M)"
                        echo "Daily tag already exists, using ${TAG}"
                      fi

                      echo "Creating docs tag: ${TAG}"
                      git tag "$TAG"
                      git push origin "$TAG"

                      # Intentionally no `gh release create` here. Docs syncs are
                      # not releases; the tag exists to identify the snapshot and
                      # to trigger the Docker image build.
              - step:
                  identifier: fail_when_degraded
                  name: Fail when sync is degraded
                  type: Run
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.check_and_update.spec.execution.steps.check_updates.output.outputVariables.DEGRADED> == "true"
                  spec:
                    shell: Sh
                    command: |
                      # The healthy sources were merged and tagged above. Fail
                      # last, so a degraded source turns the run red without
                      # holding back everything that did sync.
                      echo "The docs sync published, but at least one source is degraded."
                      echo "See the open 'Docs sync degraded' issue, or the body of the merged pull request."
                      exit 1
