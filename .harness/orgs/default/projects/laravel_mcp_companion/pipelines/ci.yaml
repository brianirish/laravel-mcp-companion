pipeline:
  identifier: ci
  name: CI
  orgIdentifier: default
  projectIdentifier: laravel_mcp_companion
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: Laravel_MCP_Companion
        repoName: brianirish/laravel-mcp-companion
  stages:
    - stage:
        identifier: test
        name: Test
        type: CI
        spec:
          cloneCodebase: true
          # Caching is intentionally disabled. The previous config cached `.venv`
          # with no cache key, which the plugin requires whenever custom paths are
          # used, so both cache steps failed on every run and left the stage
          # permanently IGNORE_FAILED, masking the status of the steps that matter.
          # To reinstate it, cache `~/.cache/uv` (which now holds both the wheel
          # cache and the managed CPython download) with a key derived from
          # requirements*.txt, and confirm the stage reports SUCCEEDED afterwards.
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: install_dependencies
                  name: Install Dependencies
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail

                      # The runner image ships Python 3.10, but this project
                      # declares requires-python = ">=3.12" (see also
                      # .python-version and the package classifiers). CI was
                      # therefore testing an interpreter the project does not
                      # claim to support. Install the declared version rather
                      # than inheriting whatever the image happens to provide.
                      # Pin where uv lands. Its installer honours XDG_BIN_HOME
                      # ahead of ~/.local/bin, so on a runner that sets it the
                      # binary would be off PATH and this step would die.
                      export UV_INSTALL_DIR="$HOME/.local/bin"
                      curl -LsSf --retry 3 --retry-delay 2 https://astral.sh/uv/install.sh | sh
                      export PATH="$UV_INSTALL_DIR:$PATH"

                      uv python install 3.12
                      uv venv --python 3.12 .venv
                      uv pip install --python .venv/bin/python \
                        -r requirements.txt -r requirements-dev.txt

                      # Later steps run in fresh shells, so they invoke the
                      # interpreter by path rather than activating the venv. That
                      # works because these steps run on the host VM; adding an
                      # `image:` to any of them would leave .venv/bin/python
                      # pointing at an interpreter under $HOME that is no longer
                      # mounted. Fail loudly here rather than three steps later.
                      .venv/bin/python --version
                      .venv/bin/python -c "import fastmcp, pytest, ruff" 2>/dev/null \
                        || .venv/bin/python -c "import fastmcp"
              - step:
                  identifier: fetch_tags
                  name: Fetch release tags
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      # The clone carries no tags, so the version-drift guard in
                      # test_version_consistency.py found none and skipped -- it
                      # has never actually run in CI. That guard exists because
                      # the manifest once sat at 0.9.0 while tags reached
                      # v0.9.145, which is precisely the drift CI should catch.
                      #
                      # Non-fatal on purpose: if the fetch cannot authenticate,
                      # the guard skips exactly as it does today rather than
                      # turning a credentials problem into a red build.
                      git fetch --tags --quiet || echo "no tags fetched; version guard will skip"
                      echo "newest release tag: $(git tag --list 'v*' --sort=-v:refname | head -1)"
              - step:
                  identifier: lint
                  name: Lint with ruff
                  type: Run
                  spec:
                    shell: Sh
                    command: .venv/bin/ruff check .
              - step:
                  identifier: typecheck
                  name: Type check with mypy
                  type: Run
                  spec:
                    shell: Sh
                    command: .venv/bin/mypy --ignore-missing-imports .
              - step:
                  identifier: test
                  name: Run tests
                  type: Run
                  spec:
                    shell: Sh
                    command: .venv/bin/pytest --cov --cov-branch --cov-report=xml --junitxml=results.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - results.xml
              - step:
                  identifier: docker_build
                  name: Build Docker image
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail

                      # Nothing built the image for the life of the project, so
                      # the first real build of a Dockerfile change was the next
                      # release -- where a mistake breaks the release rather than
                      # a pull request. Build it here instead.
                      #
                      # Single-arch on purpose. This validates the Dockerfile;
                      # the release pipeline does the multi-arch buildx run, and
                      # emulating arm64 here would cost minutes for no extra
                      # signal. No push either: publishing is the release
                      # pipeline's job.
                      docker build -t laravel-mcp-companion:ci .

                      # A build proves the image assembles, not that it runs.
                      # Starting it catches a broken entrypoint, a missing
                      # runtime dependency, and a .dockerignore that swallowed
                      # something the server needs.
                      docker run --rm laravel-mcp-companion:ci --help > /dev/null
                      echo "image builds and starts"
              - step:
                  identifier: mcp_inspector_smoke_test
                  name: MCP Inspector smoke test
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      # Harness Cloud runner ships Node v16, Inspector requires >= 22
                      curl -fsSL https://fnm.vercel.app/install | bash
                      export PATH="$HOME/.local/share/fnm:$PATH"
                      eval "$(fnm env)"
                      fnm install 22
                      fnm use 22
                      # Inspector 2.0 requires the server command before --method.
                      # Use the project venv, not the image's default interpreter.
                      npx @modelcontextprotocol/inspector@2 --cli .venv/bin/python laravel_mcp_companion.py --method tools/list | grep -q "search_laravel_docs"

