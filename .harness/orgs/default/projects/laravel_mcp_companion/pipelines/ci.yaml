pipeline:
  identifier: ci
  name: CI
  orgIdentifier: default
  projectIdentifier: laravel_mcp_companion
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: Laravel_MCP_Companion
        repoName: brianirish/laravel-mcp-companion
  stages:
    - stage:
        identifier: test
        name: Test
        type: CI
        spec:
          cloneCodebase: true
          # Caching is intentionally disabled. The previous config cached `.venv`,
          # which this pipeline never creates (dependencies are installed with a
          # plain `pip install`), and supplied no cache key, which the cache plugin
          # requires whenever custom paths are used. Both cache steps therefore
          # failed on every run and left the stage permanently IGNORE_FAILED,
          # masking the status of the steps that actually matter.
          # To reinstate caching, point it at a directory the pipeline populates
          # (e.g. ~/.cache/pip) with a key derived from requirements*.txt.
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: install_dependencies
                  name: Install Dependencies
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail

                      # The runner image ships Python 3.10, but this project
                      # declares requires-python = ">=3.12" (see also
                      # .python-version and the package classifiers). CI was
                      # therefore testing an interpreter the project does not
                      # claim to support. Install the declared version rather
                      # than inheriting whatever the image happens to provide.
                      curl -LsSf https://astral.sh/uv/install.sh | sh
                      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

                      uv python install 3.12
                      uv venv --python 3.12 .venv
                      uv pip install --python .venv/bin/python \
                        -r requirements.txt -r requirements-dev.txt

                      # Later steps run in fresh shells, so they invoke the
                      # interpreter by path rather than activating the venv.
                      .venv/bin/python --version
              - step:
                  identifier: lint
                  name: Lint with ruff
                  type: Run
                  spec:
                    shell: Sh
                    command: .venv/bin/ruff check .
              - step:
                  identifier: typecheck
                  name: Type check with mypy
                  type: Run
                  spec:
                    shell: Sh
                    command: .venv/bin/mypy --ignore-missing-imports .
              - step:
                  identifier: test
                  name: Run tests
                  type: Run
                  spec:
                    shell: Sh
                    command: .venv/bin/pytest --cov --cov-branch --cov-report=xml --junitxml=results.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - results.xml
              - step:
                  identifier: mcp_inspector_smoke_test
                  name: MCP Inspector smoke test
                  type: Run
                  spec:
                    shell: Bash
                    command: |
                      # Harness Cloud runner ships Node v16, Inspector requires >= 22
                      curl -fsSL https://fnm.vercel.app/install | bash
                      export PATH="$HOME/.local/share/fnm:$PATH"
                      eval "$(fnm env)"
                      fnm install 22
                      fnm use 22
                      # Inspector 2.0 requires the server command before --method.
                      # Use the project venv, not the image's default interpreter.
                      npx @modelcontextprotocol/inspector@2 --cli .venv/bin/python laravel_mcp_companion.py --method tools/list | grep -q "search_laravel_docs"

