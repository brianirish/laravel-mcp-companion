[pytest]
minversion = 6.0
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --strict-config
;   Which files are measured is defined once in pyproject.toml under
;   [tool.coverage.run]; listing modules here as well let the two configs drift.
    --cov
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
;   This is a ratchet, not a target. It sits just below current coverage so the
;   gate catches regressions; raise it as coverage improves. Measured 81.0% on
;   2026-08-02 when the v0.13.0 coverage push landed; the earlier 80 that
;   "passed" in CI was counting the test suite itself.
    --cov-fail-under=80
;   e2e tests spawn the real server as a subprocess; they run explicitly via
;   `pytest -m e2e --no-cov` (the CLI -m overrides this one) and as their own
;   CI step, so a wedged subprocess cannot mask the unit suite.
    -m "not e2e"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    network: marks tests that require network access
    external: marks tests that interact with external services
    protocol: marks tests as MCP protocol compliance tests
    e2e: end-to-end tests through real transports (run with -m e2e --no-cov)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S