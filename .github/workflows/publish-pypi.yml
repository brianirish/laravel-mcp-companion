# Publishes a tagged release to PyPI.
#
# Manual only, for now. PyPI trusted publishing has to be set up once by the
# project owner before any run can succeed:
#
#   1. On pypi.org, add a "pending publisher" for the project
#      `laravel-mcp-companion`: owner `brianirish`, repository
#      `laravel-mcp-companion`, workflow `publish-pypi.yml`, environment `pypi`.
#   2. In this repository's settings, create an environment named `pypi`.
#
# After the first successful run, add `push: tags: ["v*"]` under `on:` so a
# release publishes itself, and add a `pypi` package to server.json so the MCP
# Registry lists it beside the Docker image. The registry verifies ownership
# of a PyPI package through the `mcp-name:` line in the README, which is
# already there.
#
# Authentication is GitHub Actions OIDC. No API token is stored anywhere.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.15.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC authentication to PyPI
      contents: read

    steps:
      - name: Checkout the release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the project version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match pyproject.toml version ${VERSION}"
            exit 1
          fi

      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel runs offline from a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python - <<'PY'
          import laravel_mcp_companion as package
          docs = package.resource_path("docs")
          assert docs.parent == package.PACKAGE_DIR, f"corpus is not inside the wheel: {docs}"
          assert any(docs.glob("*.x/*.md")), "the wheel carries no documentation"
          print("version", package.__version__, "corpus", docs)
          PY
          /tmp/wheel-check/bin/laravel-mcp-companion --help > /dev/null

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
