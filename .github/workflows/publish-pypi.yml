# Publishes a release to PyPI when its vX.Y.Z tag is pushed.
#
# Authentication is GitHub Actions OIDC, through a trusted publisher set up on
# pypi.org for this repository, this workflow file and the `pypi` environment.
# No API token is stored anywhere. Renaming this file or the environment
# breaks publishing until the publisher on pypi.org is changed to match.
#
# PyPI never accepts the same version twice, so a failed run can be started
# again by hand with the tag, but a published version cannot be replaced.
#
# docs-YYYY-MM-DD tags are documentation syncs, not releases; "v*" never
# matches them.
#
# The MCP Registry workflow starts on the same tag and waits for the package
# this one uploads.

name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.15.1)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC authentication to PyPI
      contents: read

    steps:
      - name: Checkout the release
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the project version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          # A release candidate is tagged v1.0.0-rc1 and versioned 1.0.0rc1.
          if [ "v${VERSION}" != "${TAG/-/}" ]; then
            echo "::error::tag ${TAG} does not match pyproject.toml version ${VERSION}"
            exit 1
          fi

      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel runs offline from a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python - <<'PY'
          import laravel_mcp_companion as package
          docs = package.resource_path("docs")
          assert docs.parent == package.PACKAGE_DIR, f"corpus is not inside the wheel: {docs}"
          assert any(docs.glob("*.x/*.md")), "the wheel carries no documentation"
          print("version", package.__version__, "corpus", docs)
          PY
          /tmp/wheel-check/bin/laravel-mcp-companion --help > /dev/null

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
