# Publishes the server to the official MCP Registry on version tags.
#
# Registry authentication uses GitHub Actions OIDC. The Release image workflow
# builds and pushes the Docker image on the same tag, and the PyPI workflow
# uploads the Python package on it. The two wait steps below cover the race
# with each, since the registry checks what it is given: that the image
# exists and carries the io.modelcontextprotocol.server.name label, and that
# the PyPI package exists and has the `mcp-name:` line in its README.
#
# Image tags carry the leading v: the image is tagged with the git tag
# verbatim (ghcr.io/...:v0.12.0), while server.json's semver version fields
# are bare (0.12.0). The first publish run failed by conflating the two.
#
# workflow_dispatch exists to re-publish an already-tagged release when this
# workflow fails after the tag is up (as that first run did) — re-pushing a
# release tag to re-trigger the push event is not an option.
#
# docs-YYYY-MM-DD tags are documentation syncs, not releases; "v*" never
# matches them.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.12.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC authentication to the registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve the release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${DISPATCH_TAG}" ]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'${TAG}' is not a vX.Y.Z release tag"; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the Docker image the Release image workflow builds on this tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          IMAGE="ghcr.io/brianirish/laravel-mcp-companion:${TAG}"
          echo "Waiting for ${IMAGE}"
          for attempt in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "Image found after ${attempt} checks"
              exit 0
            fi
            sleep 30
          done
          echo "::error::${IMAGE} never appeared; did the Release image workflow succeed?"
          exit 1

      - name: Wait for the package the PyPI workflow uploads on this tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # PyPI writes a release candidate as 1.0.0rc1, the tag as v1.0.0-rc1.
          VERSION="${TAG#v}"
          URL="https://pypi.org/pypi/laravel-mcp-companion/${VERSION/-/}/json"
          echo "Waiting for ${URL}"
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "${URL}" 2>/dev/null; then
              echo "Package found after ${attempt} checks"
              exit 0
            fi
            sleep 30
          done
          echo "::error::${URL} never appeared; did the PyPI workflow succeed?"
          exit 1

      - name: Stamp the release into server.json
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "${VERSION}" --arg t "${TAG}" --arg p "${VERSION/-/}" '
            .version = $v
            | (.packages[] | select(.registryType == "oci") | .identifier) |= sub(":[^:]*$"; ":" + $t)
            | (.packages[] | select(.registryType == "pypi") | .version) = $p
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
