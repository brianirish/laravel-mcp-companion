# Raises an issue when the nightly documentation sync has stopped publishing.
#
# The sync is .github/workflows/docs-update.yaml. When a run fails, GitHub
# emails. When a run never starts, nothing does. That has stopped the sync
# twice, the first time for five weeks, and GitHub itself disables scheduled
# workflows in a repository with no activity for 60 days. This workflow looks
# at the result instead of the run. The sync pushes a docs-YYYY-MM-DD tag
# whenever it publishes, and scripts/docs_sync_watch.py reports when the
# newest one is more than a few days old.

name: Docs sync watch

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC, six and a half hours after the sync
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check when the sync last published
        id: check
        run: |
          set +e
          MESSAGE="$(git ls-remote --tags origin 'docs-*' | python3 scripts/docs_sync_watch.py)"
          STATUS=$?
          set -e
          echo "${MESSAGE}"
          echo "stale=$([ "${STATUS}" -ne 0 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          {
            echo "message<<MESSAGE_END"
            echo "${MESSAGE}"
            echo "MESSAGE_END"
          } >> "${GITHUB_OUTPUT}"

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.check.outputs.stale }}
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          TITLE="Docs sync has stopped publishing"
          EXISTING="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"

          if [ "${STALE}" = "true" ]; then
            BODY="${MESSAGE}

          Things to check, most likely first:

          - The runs of the \`Docs update\` workflow under the Actions tab. If there are none for recent nights, the workflow may be disabled; GitHub disables scheduled workflows after 60 days without repository activity.
          - Whether the last run failed, and at which step. A rejected \`PAT_FOR_WORKFLOWS\` secret fails at \"Check the token used for pushing\".
          - Whether the night's pull request is still open, waiting on a required check.
          - Whether the upstream documentation simply has not changed. The sync tags only when it publishes something."
            if [ -n "${EXISTING}" ]; then
              gh issue edit "${EXISTING}" --body "${BODY}"
            else
              gh issue create --title "${TITLE}" --body "${BODY}"
            fi
          elif [ -n "${EXISTING}" ]; then
            gh issue close "${EXISTING}" --comment "${MESSAGE}"
          fi
