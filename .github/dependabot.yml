# Proposes the next commit for each pinned action and the next base image.
#
# The workflows name every action by commit, because a tag can be moved to
# different code. A commit never moves, so without this the pins would stay
# where they are while fixes are published.
#
# Python dependencies are not listed. Security updates for them are already
# on in the repository settings and open a pull request when an advisory is
# published; version updates for the ninety packages in uv.lock would be
# several pull requests a week.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image runs the Python that uv.lock was resolved for and that
      # ci-test runs. Moving to a newer Python is a decision made here, with
      # the lockfile, and not a base image bump: on 3.15 the locked
      # pydantic-core has no wheel for Alpine and the build fails. Patch
      # releases of the same Python still arrive under the 3.12-alpine tag.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
