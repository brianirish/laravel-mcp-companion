,"image":null,"buttonText":null,"sale":{"coupon":"3HFZu3bqgdfvIp69nrsu3lAQ71YZag"}},"recaptchaKey":"0x4AAAAAAACQcLxtW0lUz22W","query":{"topics":["laravel"]},"appHost":"laracasts.com","series":{"data":[{"id":264,"title":"The Batteries-Included AI Toolkit","body":"<p>The <a href=\"https:\/\/laravel.com\/ai\">Laravel AI SDK<\/a> is a first-party toolkit for adding AI features to your applications. Using a helpdesk app as our playground, you’ll learn structured output, chat with memory, streaming, tool use, retrieval, and everything else you need to build AI features that are reliable, testable, and ready for production.<\/p>\r\n<p>This is an incredibly powerful toolkit, and I can't wait to show you what you can build. Let's get going!<\/p>\r\n","path":"\/series\/the-batteries-included-ai-toolkit","strippedBody":"The Laravel AI SDK is a first-party toolkit for adding AI features to your applications. Using a helpdesk app as our playground, you’ll learn structured output, chat with memory, streaming, tool use, retrieval, and everything else you need to build AI features that are reliable, testable, and ready for production.\r\nThis is an incredibly powerful toolkit, and I can't wait to show you what you can build. Let's get going!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/the-batteries-included-ai-toolkit-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/the-batteries-included-ai-toolkit-open-graph.png","trailer":"https:\/\/laracasts.nyc3.digitaloceanspaces.com\/series\/trailers\/ai-toolkit-trailer.mp4","slug":"the-batteries-included-ai-toolkit","episodeCount":13,"difficultyLevel":"Intermediate","complete":1,"runTime":"3h 10m","taxonomy":{"name":"AI","path":"https:\/\/laracasts.com\/browse\/ai"},"author":{"id":24345,"avatar":"https:\/\/images.laracasts.com\/instructors\/24345.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-03-23T13:55:07.000000Z","launchForHumans":"March 23, 2026","lastUpdated":"Mar 23, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/the-batteries-included-ai-toolkit\/episodes\/1","bookmark":"\/series\/the-batteries-included-ai-toolkit\/bookmark"}},{"id":246,"title":"React, The Laravel Way","body":"<p>In &quot;<a href=\"https:\/\/laracasts.com\/series\/react-from-scratch\">React from Scratch<\/a>&quot;, we built a &quot;DevPups&quot; app from scratch. Now it's time to take things further. Using that finished app as a base, you'll learn how to construct a React-powered app...the Laravel way!<p>\r\nYou'll see how we can swap out fragile external API calls for Laravel's elegant backend, add real-time &quot;like&quot; functionality, support file uploads, and polish up our CRUD features with proper authorization. Along the way, you'll get comfortable with Inertia.js, the perfect glue between Laravel's backend strength and React's frontend flexibility.<\/p>\r\n<p>By the end of this series, you'll have constructed a production-ready app that shows the Laravel way of working with React: fewer moving parts, cleaner architecture, and faster development.<\/p>\r\n","path":"\/series\/react-the-laravel-way","strippedBody":"In &quot;React from Scratch&quot;, we built a &quot;DevPups&quot; app from scratch. Now it's time to take things further. Using that finished app as a base, you'll learn how to construct a React-powered app...the Laravel way!\r\nYou'll see how we can swap out fragile external API calls for Laravel's elegant backend, add real-time &quot;like&quot; functionality, support file uploads, and polish up our CRUD features with proper authorization. Along the way, you'll get comfortable with Inertia.js, the perfect glue between Laravel's backend strength and React's frontend flexibility.\r\nBy the end of this series, you'll have constructed a production-ready app that shows the Laravel way of working with React: fewer moving parts, cleaner architecture, and faster development.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/react-the-laravel-way.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/react-the-laravel-way.png","slug":"react-the-laravel-way","episodeCount":30,"difficultyLevel":"Intermediate","complete":1,"runTime":"6h 25m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":80737,"avatar":"https:\/\/images.laracasts.com\/instructors\/80737.jpeg?tr=w-50,h-50,q-60,fo-top","username":"simonswiss","profile":{"full_name":"Simon Vrachliotis"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-09-17T14:00:00.000000Z","launchForHumans":"September 17, 2025","lastUpdated":"Sep 17, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/react-the-laravel-way\/episodes\/1","bookmark":"\/series\/react-the-laravel-way\/bookmark"}},{"id":242,"title":"Defensive Laravel","body":"<p>In this series, we'll take a deep-dive into various strategies and tools that will help you write robust and reliable code. We'll explore core defensive programming concepts, from strict typing and immutable objects to leveraging value objects for more effective domain modeling. Okay, let's dig in!<\/p>\n","path":"\/series\/defensive-laravel","strippedBody":"In this series, we'll take a deep-dive into various strategies and tools that will help you write robust and reliable code. We'll explore core defensive programming concepts, from strict typing and immutable objects to leveraging value objects for more effective domain modeling. Okay, let's dig in!\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/defensive-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\ tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-10-04T17:37:13.000000Z","launchForHumans":"October 4, 2024","lastUpdated":"Oct 4, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/livewire-3-from-scratch\/episodes\/1","bookmark":"\/series\/livewire-3-from-scratch\/bookmark"}},{"id":220,"title":"Let's Build a SaaS in Laravel","body":"<p>There are endless tutorials online for how to build an idealized project, based on what's easy to teach. In this course, however, we're going to walk through the real-life, actual process of building a software-as-a-service, including the mistakes and misconceptions I ran into along the way. We'll build not based on what's easy to teach, but based on the weird and often-inconvenient stuff users request!<\/p>\r\n","path":"\/series\/lets-build-a-saas-in-laravel","strippedBody":"There are endless tutorials online for how to build an idealized project, based on what's easy to teach. In this course, however, we're going to walk through the real-life, actual process of building a software-as-a-service, including the mistakes and misconceptions I ran into along the way. We'll build not based on what's easy to teach, but based on the weird and often-inconvenient stuff users request!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/lets-build-a-sass-with-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/lets-build-a-saas-in-laravel.png","slug":"lets-build-a-saas-in-laravel","episodeCount":12,"difficultyLevel":"Intermediate","complete":1,"runTime":"3h 17m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":22175,"avatar":"https:\/\/images.laracasts.com\/instructors\/22175.jpeg?tr=w-50,h-50,q-60,fo-top","username":"mattstauffer","profile":{"full_name":"Matt Stauffer"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-08-14T12:18:17.000000Z","launchForHumans":"August 14, 2024","lastUpdated":"Aug 14, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/lets-build-a-saas-in-laravel\/episodes\/1","bookmark":"\/series\/lets-build-a-saas-in-laravel\/bookmark"}},{"id":219,"title":"Real Time Games With Laravel","body":"<p>I want to build a game. No, I'm not talking about some intricate RPG; just a nice simple game of Tic-Tac-Toe. But my version of the game will be online, with real-time moves, using websockets, Reverb and Echo. Why don't you come along with me as we put all these pieces together to craft the ultimate version of noughts and crosses!<\/p>\r\n","path":"\/series\/real-time-games-with-laravel","strippedBody":"I want to build a game. No, I'm not talking about some intricate RPG; just a nice simple game of Tic-Tac-Toe. But my version of the game will be online, with real-time moves, using websockets, Reverb and Echo. Why don't you come along with me as we put all these pieces together to craft the ultimate version of noughts and crosses!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/real-time-games-with-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/real-time-games-with-laravel.png","slug":"real-time-games-with-laravel","episodeCount":7,"difficultyLevel":"Intermediate","complete":1,"runTime":"1h 23m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":253739,"avatar":"https:\/\/images.laracasts.com\/instructors\/253739.jpeg?tr=w-50,h-50,q-60,fo-top","username":"lukedowning19","profile":{"full_name":"Luke Downing"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-08-13T16:11:09.000000Z","launchForHumans":"August 13, 2024","lastUpdated":"Aug 13, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/real-time-games-with-laravel\/episodes\/1","bookmark":"\/series\/real-time-games-with-laravel\/bookmark"}},{"id":215,"title":"Understanding Laravel's Context Capabilities","body":"<p>As part of the Laravel 11 release, the core team introduced a new powerful feature called Context that allows you to capture, retrieve, and share information throughout your application during a single request. If you're curious, join me as I guide you through the basic usage, while providing a variety of examples that you can implement within your own projects.<\/p>\r\n","path":"\/series\/understanding-laravels-context-capabilities","strippedBody":"As part of the Laravel 11 release, the core team introduced a new powerful feature called Context that allows you to capture, retrieve, and share information throughout your application during a single request. If you're curious, join me as I guide you through the basic usage, while providing a variety of examples that you can implement within your own projects.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/deeper-insight-with-laravel-context.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/understanding-laravels-context-capabilities.png","slug":"understanding-laravels-context-capabilities","episodeCount":6,"difficultyLevel":"Intermediate","complete":1,"runTime":"48m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":24345,"avatar":"https:\/\/images.laracasts.com\/instructors\/24345.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-06-27T13:36:17.000000Z","launchForHumans":"June 27, 2024","lastUpdated":"Jun 27, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/understanding-laravels-context-capabilities\/episodes\/1","bookmark":"\/series\/understanding-laravels-context-capabilities\/bookmark"}},{"id":203,"title":"Build a Forum With Laravel","body":"<p>Building a forum is a great playground for getting acquainted with Laravel; there are so many little things to think about that really stretch the framework… and our minds! It's been a while since we built one on Laracasts, so join me as we create a feature rich forum together using the powerful ecosystem Laravel provides. Let's go!<\/p>\r\n","path":"\/series\/build-a-forum-with-laravel","strippedBody":"Building a forum is a great playground for getting acquainted with Laravel; there are so many little things to think about that really stretch the framework… and our minds! It's been a while since we built one on Laracasts, so join me as we create a feature rich forum together using the powerful ecosystem Laravel provides. Let's go!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/build-a-forum-with-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/build-a-forum-with-laravel.png","slug":"build-a-forum-with-laravel","episodeCount":51,"difficultyLevel":"Advanced","complete":1,"runTime":"10h 45m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":253739,"avatar":"https:\/\/images.laracasts.com\/instructors\/253739.jpeg?tr=w-50,h-50,q-60,fo-top","username":"lukedowning19","profile":{"full_name":"Luke Downing"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-06-14T23:53:23.000000Z","launchForHumans":"June 14, 2024","lastUpdated":"Jun 14, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/build-a-forum-with-laravel\/episodes\/1","bookmark":"\/series\/build-a-forum-with-laravel\/bookmark"}},{"id":214,"title":"How to Contribute to Open Source","body":"<p>Armed with a computer, some git knowledge, and an idea, any of us can contribute to the frameworks and packages that we use every day. Cool as that may be, it can initially be a daunting experience.&nbsp;<\/p><p>So let's go on a journey together, as we take an idea for Laravel Prompts from musings to merging. Learning the basic processes will put you in good stead for contributing your own ideas.<\/p>\r\n","path":"\/series\/how-to-contribute-to-open-source","strippedBody":"Armed with a computer, some git knowledge, and an idea, any of us can contribute to the frameworks and packages that we use every day. Cool as that may be, it can initially be a daunting experience.&nbsp;So let's go on a journey together, as we take an idea for Laravel Prompts from musings to merging. Learning the basic processes will put you in good stead for contributing your own ideas.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/how-to-contribute-to-open-source.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/how-to-contribute-to-open-source.png","slug":"how-to-contribute-to-open-source","episodeCount":13,"difficultyLevel":"Intermediate","complete":1,"runTime":"1h 49m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":253739,"avatar":"https:\/\/images.laracasts.com\/instructors\/253739.jpeg?tr=w-50,h-50,q-60,fo-top","username":"lukedowning19","profile":{"full_name":"Luke Downing"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-05-31T13:50:06.000000Z","launchForHumans":"May 31, 2024","lastUpdated":"May 31, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/how-to-contribute-to-open-source\/episodes\/1","bookmark":"\/series\/how-to-contribute-to-open-source\/bookmark"}},{"id":213,"title":"Learn Laravel and Vite","body":"<p>Laravel provides seamless integration with Vite, a next generation front-end bundler that is lightning fast. In this miniseries, join me as I outline Laravel's Vite integration in a way that's easy to understand. You'll be bundling your client-side assets in no time!<\/p>\r\n","path":"\/series\/laravel-and-vite","strippedBody":"Laravel provides seamless integration with Vite, a next generation front-end bundler that is lightning fast. In this miniseries, join me as I outline Laravel's Vite integration in a way that's easy to understand. You'll be bundling your client-side assets in no time!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/laravel-and-vite.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/laravel-and-vite.png","slug":"laravel-and-vite","episodeCount":8,"difficultyLevel":"Intermediate","complete":1,"runTime":"57m","taxonomy":{"name":"Tooling","path":"https:\/\/laracasts.com\/browse\/tooling"},"author":{"id":24345,"avatar":"https:\/\/images.laracasts.com\/instructors\/24345.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-05-22T19:32:21.000000Z","launchForHumans":"May 22, 2024","lastUpdated":"May 22, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/laravel-and-vite\/episodes\/1","bookmark":"\/series\/laravel-and-vite\/bookmark"}},{"id":212,"title":"Laravel API Master Class","body":"<p>In this workshop series, you'll learn how to design, version, build, and protect a web API using Laravel. We'll begin from scratch with a basic Laravel project, and construct a fully-featured API one lesson at a time.<\/p>\r\n","path":"\/series\/laravel-api-master-class","strippedBody":"In this workshop series, you'll learn how to design, version, build, and protect a web API using Laravel. We'll begin from scratch with a basic Laravel project, and construct a fully-featured API one lesson at a time.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/laravel-api-master-class.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/laravel-api-master-class.png","slug":"laravel-api-master-class","episodeCount":24,"difficultyLevel":"Advanced","complete":1,"runTime":"4h 44m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":24345,"avatar":"https:\/\/images.laracasts.com\/instructors\/24345.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-04-30T13:12:17.000000Z","launchForHumans":"April 30, 2024","lastUpdated":"Apr 30, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/laravel-api-master-class\/episodes\/1","bookmark":"\/series\/laravel-api-master-class\/bookmark"}},{"id":209,"title":"What's New in Laravel 11","body":"<p>Another year, another major Laravel version! Laravel 11 doubles down on simplicity and productivity, focusing on getting you up and running as quickly as possible. Let's take a quick look at the stand-out features that you absolutely should be aware of.<\/p>\n","path":"\/series\/whats-new-in-laravel-11","strippedBody":"Another year, another major Laravel version! Laravel 11 doubles down on simplicity and productivity, focusing on getting you up and running as quickly as possible. Let's take a quick look at the stand-out features that you absolutely should be aware of.\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/whats-new-in-laravel-11.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/whats-new-in-laravel-11.png","slug":"whats-new-in-laravel-11","episodeCount":14,"difficultyLevel":"Intermediate","complete":1,"runTime":"51m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":253739,"avatar":"https:\/\/images.laracasts.com\/instructors\/253739.jpeg?tr=w-50,h-50,q-60,fo-top","username":"lukedowning19","profile":{"full_name":"Luke Downing"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-03-12T11:11:03.000000Z","launchForHumans":"March 12, 2024","lastUpdated":"Mar 12, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/whats-new-in-laravel-11\/episodes\/1","bookmark":"\/series\/whats-new-in-laravel-11\/bookmark"}},{"id":205,"title":"Modular Laravel","body":"<p>In this course, we'll discuss the modular monolith, or - if you want to sound fancy - a module-oriented architecture. A modular monolith provides a fantastic middle-ground between the simplicity of a traditional monolithic architecture, and some of the benefits you might encounter within a microservice-based architecture. Curious to learn more? Let's get going!<\/p>\r\n","path":"\/series\/modular-laravel","strippedBody":"In this course, we'll discuss the modular monolith, or - if you want to sound fancy - a module-oriented architecture. A modular monolith provides a fantastic middle-ground between the simplicity of a traditional monolithic architecture, and some of the benefits you might encounter within a microservice-based architecture. Curious to learn more? Let's get going!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/modular-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/modular-laravel.png","slug":"modular-laravel","episodeCount":25,"difficultyLevel":"Advanced","complete":1,"runTime":"3h 31m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":21268,"avatar":"https:\/\/images.laracasts.com\/instructors\/21268.jpeg?tr=w-50,h-50,q-60,fo-top","username":"mateusjatenee","profile":{"full_name":"Mateus Guimarães"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2024-01-04T16:46:02.000000Z","launchForHumans":"January 4, 2024","lastUpdated":"Jan 4, 2024"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/modular-laravel\/episodes\/1","bookmark":"\/series\/modular-laravel\/bookmark"}},{"id":200,"title":"Code-Breaking Workshop","body":"<p>When I finish up work for the day, and switch back to dad mode, my kids love to do these little \"code-breaking\" worksheets where each letter in a secret message is represented as a symbol. They then refer to an alphabet lookup table, and perform the translation.<\/p><p>There's only one problem... they take me a long time to manually create from scratch on paper. So let's build a kid-friendly web app to automate the entire process!<\/p>\r\n","path":"\/series\/code-breaking-workshop","strippedBody":"When I finish up work for the day, and switch back to dad mode, my kids love to do these little \"code-breaking\" worksheets where each letter in a secret message is represented as a symbol. They then refer to an alphabet lookup table, and perform the translation.There's only one problem... they take me a long time to manually create from scratch on paper. So let's build a kid-friendly web app to automate the entire process!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/codebreaking-workshop.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/code-breaking-workshop.png","slug":"code-breaking-workshop","episodeCount":7,"difficultyLevel":"Intermediate","complete":1,"runTime":"1h 10m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2023-11-03T20:21:16.000000Z","launchForHumans":"November 3, 2023","lastUpdated":"Nov 3, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/code-breaking-workshop\/episodes\/1","bookmark":"\/series\/code-breaking-workshop\/bookmark"}},{"id":199,"title":"Valet Uncovered","body":"<p>Valet has long been the local development environment of choice for Laravel developers on macOS. The way it seamlessly works might even look like magic!<\/p><p>In this CreatorSeries, we'll dig into how to install and use Valet, explore some of its often-missed features, and walk through how the pieces fit together under the hood.<\/p>\n","path":"\/series\/valet-uncovered","strippedBody":"Valet has long been the local development environment of choice for Laravel developers on macOS. The way it seamlessly works might even look like magic!In this CreatorSeries, we'll dig into how to install and use Valet, explore some of its often-missed features, and walk through how the pieces fit together under the hood.\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/valet-uncovered.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/valet-uncovered.png","slug":"valet-uncovered","episodeCount":16,"difficultyLevel":"Advanced","complete":1,"runTime":"2h 5m","taxonomy":{"name":"Tooling","path":"https:\/\/laracasts.com\/browse\/tooling"},"author":{"id":22175,"avatar":"https:\/\/images.laracasts.com\/instructors\/22175.jpeg?tr=w-50,h-50,q-60,fo-top","username":"mattstauffer","profile":{"full_name":"Matt Stauffer"}},"isCreatorSeries":1,"isScheduled":false,"dates":{"launch":"2023-10-20T11:26:13.000000Z","launchForHumans":"October 20, 2023","lastUpdated":"Oct 20, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/valet-uncovered\/episodes\/1","bookmark":"\/series\/valet-uncovered\/bookmark"}},{"id":197,"title":"Build Advanced Components for Filament","body":"<p>Once you're confidently building interfaces with all the components that are included with <a href=\"https:\/\/filamentphp.com\">Filament<\/a>, you'll likely want to begin building your own custom ones.<\/p><p>\n\nHi, I'm Dan: the co-founder of Filament. This series will teach you how to build components, like custom form fields and table columns, and how to distribute them in a plugin package. Meanwhile, you'll get to know all the tools of Filament's internal component system. Excited?<\/p>","path":"\/series\/build-advanced-components-for-filament","strippedBody":"Once you're confidently building interfaces with all the components that are included with Filament, you'll likely want to begin building your own custom ones.\n\nHi, I'm Dan: the co-founder of Filament. This series will teach you how to build components, like custom form fields and table columns, and how to distribute them in a plugin package. Meanwhile, you'll get to know all the tools of Filament's internal component system. Excited?","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/build-advanced-components-for-filament.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/build-advanced-components-for-filament.png","slug":"build-advanced-components-for-filament","episodeCount":17,"difficultyLevel":"Advanced","complete":1,"runTime":"2h 32m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":167366,"avatar":"https:\/\/images.laracasts.com\/instructors\/167366.jpeg?tr=w-50,h-50,q-60,fo-top","username":"DanHarrin","profile":{"full_name":"Dan Harrin"}},"isCreatorSeries":1,"isScheduled":false,"dates":{"launch":"2023-09-18T15:48:32.000000Z","launchForHumans":"September 18, 2023","lastUpdated":"Sep 18, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/build-advanced-components-for-filament\/episodes\/1","bookmark":"\/series\/build-advanced-components-for-filament\/bookmark"}},{"id":196,"title":"Pest Driven Laravel","body":"Learn to write applications that are fully tested and a joy to work with now and in the future through TDD. Tests are the base for writing code that is easy to change, refactor and maintain. There is no reason anymore to be afraid to touch your own code. Following test-driven development establishes the mindset that integrates testing and refactoring in your daily workflow.","path":"\/series\/pest-driven-laravel","strippedBody":"Learn to write applications that are fully tested and a joy to work with now and in the future through TDD. Tests are the base for writing code that is easy to change, refactor and maintain. There is no reason anymore to be afraid to touch your own code. Following test-driven development establishes the mindset that integrates testing and refactoring in your daily workflow.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/pest-driven-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/pest-driven-laravel.png","slug":"pest-driven-laravel","episodeCount":48,"difficultyLevel":"Advanced","complete":1,"runTime":"6h 53m","taxonomy":{"name":"Testing","path":"https:\/\/laracasts.com\/browse\/testing"},"author":{"id":1262,"avatar":"https:\/\/images.laracasts.com\/instructors\/1262.jpeg?tr=w-50,h-50,q-60,fo-top","username":"christophrumpel","profile":{"full_name":"Christoph Rumpel"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2023-09-01T18:15:51.000000Z","launchForHumans":"September 1, 2023","lastUpdated":"Sep 1, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/pest-driven-laravel\/episodes\/1","bookmark":"\/series\/pest-driven-laravel\/bookmark"}},{"id":191,"title":"Demystify Laravel's Magic","body":"In this series, we'll demystify much of Laravel's magic for developers who may not understand how all the pieces fit together behind the scenes. We'll cover a variety of confusing topics, like providers, facades, contracts, and more.","path":"\/series\/demystifying-laravel-magic","strippedBody":"In this series, we'll demystify much of Laravel's magic for developers who may not understand how all the pieces fit together behind the scenes. We'll cover a variety of confusing topics, like providers, facades, contracts, and more.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/demystifying-laravels-magic.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/demystifying-laravel-magic.png","slug":"demystifying-laravel-magic","episodeCount":6,"difficultyLevel":"Advanced","complete":1,"runTime":"30m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":11951,"avatar":"https:\/\/images.laracasts.com\/instructors\/11951.jpeg?tr=w-50,h-50,q-60,fo-top","username":"themsaid","profile":{"full_name":"Mohamed Said"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2023-06-26T18:26:44.000000Z","launchForHumans":"June 26, 2023","lastUpdated":"Jun 26, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/demystifying-laravel-magic\/episodes\/1","bookmark":"\/series\/demystifying-laravel-magic\/bookmark"}},{"id":185,"title":"Automated Laravel Upgrades","body":"Hi! I'm Jason McCreary. I'm the founder of <a href=\"https:\/\/laravelshift.com\" target=\"_blank\">Laravel Shift<\/a>, a popular service that provides automatic upgrades for your Laravel applications. In this CreatorSeries, using all of the knowledge I've acquired over the years of building and maintaining Shift, I'll show you how to automate many of your every-day development tasks.","path":"\/series\/automated-laravel-upgrades","strippedBody":"Hi! I'm Jason McCreary. I'm the founder of Laravel Shift, a popular service that provides automatic upgrades for your Laravel applications. In this CreatorSeries, using all of the knowledge I've acquired over the years of building and maintaining Shift, I'll show you how to automate many of your every-day development tasks.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/automatic-laravel-upgrades-explained.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/automated-laravel-upgrades.png","slug":"automated-laravel-upgrades","episodeCount":13,"difficultyLevel":"Advanced","complete":1,"runTime":"2h 16m","taxonomy":{"name":"Tooling","path":"https:\/\/laracasts.com\/browse\/tooling"},"author":{"id":34923,"avatar":"https:\/\/images.laracasts.com\/instructors\/34923.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jason-mccreary","profile":{"full_name":"Jason McCreary"}},"isCreatorSeries":1,"isScheduled":false,"dates":{"launch":"2023-04-24T17:39:26.000000Z","launchForHumans":"April 24, 2023","lastUpdated":"Apr 24, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/automated-laravel-upgrades\/episodes\/1","bookmark":"\/series\/automated-laravel-upgrades\/bookmark"}},{"id":182,"title":"Laravel Security Through Examples","body":"<p>In this series, we'll use examples of weaknesses and vulnerabilities that are commonly found in Laravel applications to illustrate the variety of security concerns you need to be aware of as a Laravel developer. This includes general SQL injection attacks, serialization, validation, and much more. Ready to get started?<\/p>","path":"\/series\/laravel-security-through-examples","strippedBody":"In this series, we'll use examples of weaknesses and vulnerabilities that are commonly found in Laravel applications to illustrate the variety of security concerns you need to be aware of as a Laravel developer. This includes general SQL injection attacks, serialization, validation, and much more. Ready to get started?","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/laravel-security-through-examples.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/laravel-security-through-examples.png","slug":"laravel-security-through-examples","episodeCount":12,"difficultyLevel":"Intermediate","complete":1,"runTime":"2h 37m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":7413,"avatar":"https:\/\/images.laracasts.com\/instructors\/7413.jpeg?tr=w-50,h-50,q-60,fo-top","username":"Valorin","profile":{"full_name":"Stephen Rees-Carter"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2023-03-09T21:32:30.000000Z","launchForHumans":"March 9, 2023","lastUpdated":"Mar 9, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/laravel-security-through-examples\/episodes\/1","bookmark":"\/series\/laravel-security-through-examples\/bookmark"}},{"id":183,"title":"What's New in Laravel 10","body":"<p>It's a new year, and that means we also get a new major release of Laravel! As of February 14th, 2023, Laravel has now officially bumped to version 10.<\/p><p>In this series, we'll review and compare all the new features and improvements you can enjoy as part of Laravel 10. This includes support for native PHP types for all user-land code, Laravel Pennant, a new Process abstraction layer, and more!<\/p>","path":"\/series\/whats-new-in-laravel-10","strippedBody":"It's a new year, and that means we also get a new major release of Laravel! As of February 14th, 2023, Laravel has now officially bumped to version 10.In this series, we'll review and compare all the new features and improvements you can enjoy as part of Laravel 10. This includes support for native PHP types for all user-land code, Laravel Pennant, a new Process abstraction layer, and more!","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/whats-new-in-laravel-10.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/whats-new-in-laravel-10.png","slug":"whats-new-in-laravel-10","episodeCount":5,"difficultyLevel":"Intermediate","complete":1,"runTime":"37m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2023-02-17T00:02:13.000000Z","launchForHumans":"February 16, 2023","lastUpdated":"Feb 16, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/whats-new-in-laravel-10\/episodes\/1","bookmark":"\/series\/whats-new-in-laravel-10\/bookmark"}},{"id":180,"title":"Serverless Laravel","body":"<p>\"Serverless\" refers to a cloud application development model that allows developers to execute code without managing the server directly.<\/p><p>In this series, you'll learn how to deploy Laravel applications to AWS Lambda (serverless) through Laravel Vapor. In the process, we'll understand what it means to run serverlessly. We'll also look under the hood and discuss how AWS actually runs your application.<\/p>","path":"\/series\/serverless-laravel","strippedBody":"\"Serverless\" refers to a cloud application development model that allows developers to execute code without managing the server directly.In this series, you'll learn how to deploy Laravel applications to AWS Lambda (serverless) through Laravel Vapor. In the process, we'll understand what it means to run serverlessly. We'll also look under the hood and discuss how AWS actually runs your application.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/serverless-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/serverless-laravel.png","slug":"serverless-laravel","episodeCount":13,"difficultyLevel":"Advanced","complete":1,"runTime":"1h 38m","taxonomy":{"name":"DevOps","path":"https:\/\/laracasts.com\/browse\/devops"},"author":{"id":11951,"avatar":"https:\/\/images.laracasts.com\/instructors\/11951.jpeg?tr=w-50,h-50,q-60,fo-top","username":"themsaid","profile":{"full_name":"Mohamed Said"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2023-01-23T15:20:17.000000Z","launchForHumans":"January 23, 2023","lastUpdated":"Jan 23, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/serverless-laravel\/episodes\/1","bookmark":"\/series\/serverless-laravel\/bookmark"}},{"id":176,"title":"Eloquent Performance Patterns","body":"<p>In this series, you'll learn how to drastically improve the performance of your Laravel applications by pushing more work to the database, all while still using the Eloquent ORM. <\/p><p>This course is a culmination of everything I've learned along my journey, distilled into a single course. We're going to dig deep into advanced real world problems.<\/p>","path":"\/series\/eloquent-performance-patterns","strippedBody":"In this series, you'll learn how to drastically improve the performance of your Laravel applications by pushing more work to the database, all while still using the Eloquent ORM. This course is a culmination of everything I've learned along my journey, distilled into a single course. We're going to dig deep into advanced real world problems.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/eloquent-performance-patterns.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/eloquent-performance-patterns.png","slug":"eloquent-performance-patterns","episodeCount":28,"difficultyLevel":"Advanced","complete":1,"runTime":"2h 12m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":1140,"avatar":"https:\/\/images.laracasts.com\/instructors\/1140.jpeg?tr=w-50,h-50,q-60,fo-top","username":"reinink","profile":{"full_name":"Jonathan Reinink"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2023-01-13T15:43:01.000000Z","launchForHumans":"January 13, 2023","lastUpdated":"Jan 13, 2023"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/eloquent-performance-patterns\/episodes\/1","bookmark":"\/series\/eloquent-performance-patterns\/bookmark"}},{"id":174,"title":"Laravel Cookbook","body":"Welcome to the Laravel Cookbook! This series is all about building practical features for typical Laravel web application. Charts, stats, and image uploaders are just a few examples that we'll be reviewing together. We'll also leverage various JavaScript libraries whenever we require additional interactivity for a better user experience. Let's get started!","path":"\/series\/laravel-cookbook","strippedBody":"Welcome to the Laravel Cookbook! This series is all about building practical features for typical Laravel web application. Charts, stats, and image uploaders are just a few examples that we'll be reviewing together. We'll also leverage various JavaScript libraries whenever we require additional interactivity for a better user experience. Let's get started!","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/laravel-cookbook.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/laravel-cookbook.png","slug":"laravel-cookbook","episodeCount":12,"difficultyLevel":"Intermediate","complete":1,"runTime":"3h 47m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":2071,"avatar":"https:\/\/images.laracasts.com\/instructors\/2071.jpeg?tr=w-50,h-50,q-60,fo-top","username":"drehimself","profile":{"full_name":"Andre Madarang"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2022-08-16T14:38:12.000000Z","launchForHumans":"August 16, 2022","lastUpdated":"Aug 16, 2022"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/laravel-cookbook\/episodes\/1","bookmark":"\/series\/laravel-cookbook\/bookmark"}},{"id":173,"title":"Developing Serverless Functions in Laravel","body":"<p>In this CreatorSeries, we cover how to develop serverless functions with Laravel, using a package called <a href=\"https:\/\/hammerstone.dev\/sidecar\/docs\/main\/overview\" target=\"_blank\">Sidecar<\/a>. Serverless functions let you tap into the power of AWS Lambda, but without the complexity of setting up a new repo, deployment process, or API Gateway.<\/p><p>You'll learn how to package, deploy, and execute these functions... all from your Laravel application!<\/p>","path":"\/series\/developing-serverless-functions-in-laravel","strippedBody":"In this CreatorSeries, we cover how to develop serverless functions with Laravel, using a package called Sidecar. Serverless functions let you tap into the power of AWS Lambda, but without the complexity of setting up a new repo, deployment process, or API Gateway.You'll learn how to package, deploy, and execute these functions... all from your Laravel application!","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/developing-serverless-functions.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/developing-serverless-functions-in-laravel.png","slug":"developing-serverless-functions-in-laravel","episodeCount":17,"difficultyLevel":"Advanced","complete":1,"runTime":"1h 41m","taxonomy":{"name":"Tooling","path":"https:\/\/laracasts.com\/browse\/tooling"},"author":{"id":5820,"avatar":"https:\/\/images.laracasts.com\/instructors\/5820.jpeg?tr=w-50,h-50,q-60,fo-top","username":"aarondfrancis","profile":{"full_name":"Aaron Francis"}},"isCreatorSeries":1,"isScheduled":false,"dates":{"launch":"2022-07-27T13:40:20.000000Z","launchForHumans":"July 27, 2022","lastUpdated":"Jul 27, 2022"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/developing-serverless-functions-in-laravel\/episodes\/1","bookmark":"\/series\/developing-serverless-functions-in-laravel\/bookmark"}},{"id":158,"title":"Inertia and SPA Techniques","body":"So you've mastered the basics of building an SPA with Laravel and Inertia? Nice work, but of course there's always more to learn. In this series, we'll review a variety of useful tips and techniques to simplify and clean up your single page applications. This includes everything from creating webpack aliases, to wrapping third party APIs, to leveraging Laravel's API resources. So what do you think? Ready to get started?","path":"\/series\/inertia-and-spa-techniques","strippedBody":"So you've mastered the basics of building an SPA with Laravel and Inertia? Nice work, but of course there's always more to learn. In this series, we'll review a variety of useful tips and techniques to simplify and clean up your single page applications. This includes everything from creating webpack aliases, to wrapping third party APIs, to leveraging Laravel's API resources. So what do you think? Ready to get started?","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/inertia-and-spa-techniques.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/inertia-and-spa-techniques.png","slug":"inertia-and-spa-techniques","episodeCount":9,"difficultyLevel":"Advanced","complete":1,"runTime":"1h 28m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2022-03-03T21:52:46.000000Z","launchForHumans":"March 3, 2022","lastUpdated":"Mar 3, 2022"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/inertia-and-spa-techniques\/episodes\/1","bookmark":"\/series\/inertia-and-spa-techniques\/bookmark"}},{"id":163,"title":"What's New in Laravel 9","body":"<p>Laravel 9 is here, and along with it comes a wide array of useful new features and tweaks. This includes an improved accessor\/mutator API, better support for Enum casting, forced scope bindings, a new database engine for Laravel Scout, and so much more.<\/p><p>If you have 45 minutes to spare, I'll show you everything you need to know to get up to speed.<\/p>","path":"\/series\/whats-new-in-laravel-9","strippedBody":"Laravel 9 is here, and along with it comes a wide array of useful new features and tweaks. This includes an improved accessor\/mutator API, better support for Enum casting, forced scope bindings, a new database engine for Laravel Scout, and so much more.If you have 45 minutes to spare, I'll show you everything you need to know to get up to speed.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/whats-new-in-laravel-9.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/whats-new-in-laravel-9.png","slug":"whats-new-in-laravel-9","episodeCount":11,"difficultyLevel":"Intermediate","complete":1,"runTime":"44m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2022-02-07T20:07:24.000000Z","launchForHumans":"February 7, 2022","lastUpdated":"Feb 7, 2022"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/whats-new-in-laravel-9\/episodes\/1","bookmark":"\/series\/whats-new-in-laravel-9\/bookmark"}},{"id":159,"title":"GraphQL with Laravel and Vue","body":"<p>GraphQL is often looked at as the successor to REST APIs. It provides a powerful query language and allows you to make requests for exactly the information you want, nothing more and nothing less. <\/p><p>Many services now offer GraphQL APIs making it easier for users to interact with their data. With its powerful type system, the syntax is intuitive, and error messages provide helpful feedback. In this series, we’ll take a look at using GraphQL within the Laravel and Vue ecosystem. We’ll build out the obligatory blog as a full-stack GraphQL application. In the backend we’ll make use of the popular lighthouse package which allows us to define our GraphQL schema. In the frontend, we’ll leverage Vue Apollo to allow us to communicate with the backend and display the data in the browser.<\/p>","path":"\/series\/graphql-with-laravel-and-vue","strippedBody":"GraphQL is often looked at as the successor to REST APIs. It provides a powerful query language and allows you to make requests for exactly the information you want, nothing more and nothing less. Many services now offer GraphQL APIs making it easier for users to interact with their data. With its powerful type system, the syntax is intuitive, and error messages provide helpful feedback. In this series, we’ll take a look at using GraphQL within the Laravel and Vue ecosystem. We’ll build out the obligatory blog as a full-stack GraphQL application. In the backend we’ll make use of the popular lighthouse package which allows us to define our GraphQL schema. In the frontend, we’ll leverage Vue Apollo to allow us to communicate with the backend and display the data in the browser.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/graphql-with-laravel-and-vue.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/graphql-with-laravel-and-vue.png","slug":"graphql-with-laravel-and-vue","episodeCount":16,"difficultyLevel":"Advanced","complete":1,"runTime":"2h 56m","taxonomy":{"name":"Tooling","path":"https:\/\/laracasts.com\/browse\/tooling"},"author":{"id":2071,"avatar":"https:\/\/images.laracasts.com\/instructors\/2071.jpeg?tr=w-50,h-50,q-60,fo-top","username":"drehimself","profile":{"full_name":"Andre Madarang"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2022-01-04T20:10:25.000000Z","launchForHumans":"January 4, 2022","lastUpdated":"Jan 4, 2022"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/graphql-with-laravel-and-vue\/episodes\/1","bookmark":"\/series\/graphql-with-laravel-and-vue\/bookmark"}},{"id":160,"title":"Advanced Image Uploading with Vue and Laravel","body":"<p>Want to give your users the ability to upload images from your Vue frontend, but don't know where to start? In this series, we'll step through the process from start to finish. We'll begin by prepping a Laravel app to store uploaded images. Then, using a battle-tested library called <a href=\"https:\/\/github.com\/pqina\/filepond\" target=\"_blank\">Filepond<\/a>, we'll provide our Vue component with an area to drag and drop pictures to. Handling image data can be a bit complicated, especially when introducing another layer like a frontend framework. Using the libraries and techniques in this series though, I'll show you that it doesn't have to be a headache.<\/p>","path":"\/series\/advanced-image-uploading-with-vue-and-laravel","strippedBody":"Want to give your users the ability to upload images from your Vue frontend, but don't know where to start? In this series, we'll step through the process from start to finish. We'll begin by prepping a Laravel app to store uploaded images. Then, using a battle-tested library called Filepond, we'll provide our Vue component with an area to drag and drop pictures to. Handling image data can be a bit complicated, especially when introducing another layer like a frontend framework. Using the libraries and techniques in this series though, I'll show you that it doesn't have to be a headache.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/image-uploading-with-vue-and-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/social-cards\/advanced-image-uploading-with-vue-and-laravel.png","slug":"advanced-image-uploading-with-vue-and-laravel","episodeCount":8,"difficultyLevel":"Intermediate","complete":1,"runTime":"59m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":146405,"avatar":"https:\/\/images.laracasts.com\/instructors\/146405.jpeg?tr=w-50,h-50,q-60,fo-top","username":"aschmelyun","profile":{"full_name":"Andrew Schmelyun"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2022-01-10T18:32:39.000000Z","launchForHumans":"January 10, 2022","lastUpdated":"Jan 10, 2022"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/advanced-image-uploading-with-vue-and-laravel\/episodes\/1","bookmark":"\/series\/advanced-image-uploading-wi
